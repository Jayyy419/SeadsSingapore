version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Without this, Amplify builds with whatever Node its build image defaults to (22 as of
        # Oct 2026), ignoring package.json's engines and .nvmrc — and the SSR runtime then runs
        # on that same major version. Pin it so production runs the Node that CI tests on.
        - nvm install 24
        - nvm use 24
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
